  const art = (attributes = "") => `<img src="${TuantuanArt}" alt="" ${attributes}>`;
  const currentData = () => state.data[state.space];
  const currentPage = () => state.pages[state.space];
  const activeFrame = () => panelStack[panelStack.length - 1];
  const currentRecord = (id) => currentData().records.find((entry) => entry.id === id);
  const countLabel = (count) => `${count} 条`;
  const escapeCharacter = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };

  function safeText(text) {
    return String(text).replace(/[&<>"']/g, (character) => escapeCharacter[character]);
  }

  function face(mood) {
    return `<span class="face face-${mood}" aria-hidden="true"><i class="face-eye"></i><i class="face-eye"></i><i class="face-mouth"></i></span>`;
  }

  function moodDot(mood) {
    return `<i class="mood-dot" style="--mood-color:${moods[mood].color}" aria-hidden="true"></i>`;
  }

  function prop(id) {
    return `<span class="prop prop-${id}" aria-hidden="true"><i class="prop-piece"></i><i class="prop-piece"></i><i class="prop-piece"></i></span>`;
  }

  function selectOptions(items, selected, defaultLabel = "") {
    const empty = defaultLabel ? `<option value="">${defaultLabel}</option>` : "";
    return empty + Object.entries(items).map(([id, label]) =>
      `<option value="${id}"${id === selected ? " selected" : ""}>${label}</option>`
    ).join("");
  }

  function openRecordCard(record, includeDate = false) {
    const time = includeDate ? `${stamp(record.createdAt, dateOptions)} ${moment(record.createdAt)}` : moment(record.createdAt);
    return `<button class="record-card" type="button" data-action="detail" data-id="${safeText(record.id)}">
      ${face(record.mood)}
      <span class="record-text">
        <span class="record-topline">
          <strong>${moods[record.mood].label}</strong>
          ${record.scene ? `<span class="record-scene">${scenes[record.scene]}</span>` : ""}
          <time class="record-time" datetime="${new Date(record.createdAt).toISOString()}">${time}</time>
        </span>
        ${record.note ? `<span class="record-note">${safeText(record.note)}</span>` : ""}
        <span class="record-reply"><small>团团回信</small> ${safeText(reply(record))}</span>
      </span>
    </button>`;
  }

  function showToast(message) {
    clearTimeout(toastTimer);
    toast.innerHTML = `${sparkle}<span>${safeText(message)}</span>`;
    toast.hidden = false;
    toastTimer = setTimeout(() => { toast.hidden = true; }, 4300);
  }

  function animateUnlock(id) {
    clearTimeout(animationTimer);
    const host = panel.open ? panel : document.body;
    if (animation.parentElement !== host) host.append(animation);
    animation.innerHTML = `${art()}${prop(id)}<strong>新成就<br>${achievements[id].title}</strong>`;
    animation.hidden = false;
    highlightUntil = Date.now() + 4500;
    renderBadge();
    animationTimer = setTimeout(() => { animation.hidden = true; }, 1450);
    setTimeout(renderBadge, 4550);
  }

  function renderBadge() {
    const unlocked = Object.keys(currentData().unlocks).length;
    const highlight = Date.now() < highlightUntil;
    badge.classList.toggle("is-new", highlight);
    badgeCount.textContent = `${highlight ? "新成就" : "成就"} ${unlocked}/4`;
  }

  function syncComposer() {
    const draft = state.drafts[state.space];
    if (note.value !== draft.note) note.value = draft.note;
    for (const radio of form.querySelectorAll('input[name="mood"]')) {
      radio.checked = radio.value === draft.mood;
    }
    for (const button of sceneChoices.querySelectorAll("button")) {
      button.setAttribute("aria-pressed", button.dataset.id === draft.scene);
    }
    saveButton.disabled = !ready || !draft.mood || state.saving || state.switching;
    saveButton.querySelector("span").textContent = state.saving ? "正在收下…" : "收下这一刻";
  }

  function renderToday() {
    const now = new Date();
    byId("today-date").textContent = stamp(now, { ...dateOptions, weekday: "long" });
    const key = dayKey(now);
    const records = currentData().records
      .filter((record) => dayKey(record.createdAt) === key)
      .sort((a, b) => b.createdAt - a.createdAt);
    byId("today-count").textContent = countLabel(records.length);
    byId("today-list").innerHTML = records.length
      ? `<div class="record-list">${records.map((record) => openRecordCard(record)).join("")}</div>`
      : `<div class="empty-today"><span class="empty-icon">${icons("mail")}</span><span>今天还没有片段，先选一个情绪吧。</span></div>`;
    renderBadge();
  }

  function renderWeeklyPreview() {
    const { observation, days } = makeReport(currentData(), 7);
    byId("weekly-preview-example").hidden = Boolean(observation) && state.space === "personal";
    byId("weekly-preview-observation").textContent =
      observation?.text ?? "3 条通勤记录中，有 2 条选了「疲惫」。";
    const emptyDot = '<i class="mood-dot"></i>';
    byId("weekly-preview-days").innerHTML = observation
      ? days.map(({ records }) => records.length ? moodDot(records[0].mood) : emptyDot).join("")
      : moodDot("tired") + moodDot("tired") + emptyDot;
  }

  function daySummary(day) {
    const counts = Object.entries(moods).map(([id, mood]) =>
      [mood.label, day.records.filter((record) => record.mood === id).length]
    ).filter(([, count]) => count > 0);
    const description = counts.map(([label, count]) => `${label} ${count} 条`).join("、");
    return `${stamp(day.date, dateOptions)}，${description || "没有记录"}`;
  }

  function renderChart(result) {
    if (result.range === 3) {
      return `<h3>最近的片段</h3><div class="sketch-days">${[...result.days].reverse().map((day) => {
        const excerpt = day.records.find((record) => record.note)?.note ||
          day.records.map((record) => moods[record.mood].label).join("、") || "这一天没有记录";
        return `<button type="button" class="sketch-day" data-action="jump-day" data-id="${day.key}" aria-label="${daySummary(day)}"${day.records.length ? "" : " disabled"}>
          <strong>${stamp(day.date, { month: "numeric", day: "numeric" })}</strong>
          <span class="sketch-text">${safeText(excerpt)}</span>
          <span class="dots">${day.records.map((record) => moodDot(record.mood)).join("")}</span>
        </button>`;
      }).join("")}</div>`;
    }
    if (result.range === 30) {
      const weeks = result.weeks.map((days) => ({
        days, count: days.reduce((total, day) => total + day.records.length, 0),
        firstRecorded: days.find((day) => day.records.length)?.key,
      }));
      const maximum = Math.max(...weeks.map((week) => week.count), 1);
      const common = (counts, items) => counts
        .filter(([, count]) => count === counts[0][1])
        .map(([id]) => items[id].label ?? items[id]).join("、");
      const commonScenes = common(result.sceneCounts, scenes);
      return `<h3>每周留下的片段</h3><div class="week-rows">${weeks.map(({ days, count, firstRecorded }) => {
        const content = `<strong>${dateRange(days[0].date, days[days.length - 1].date)}</strong>
          <span class="week-track" aria-hidden="true"><span style="width:${count / maximum * 100}%"></span></span><span>${countLabel(count)}</span>`;
        return firstRecorded
          ? `<button type="button" class="week-row" data-action="jump-day" data-id="${firstRecorded}">${content}</button>`
          : `<div class="week-row">${content}</div>`;
      }).join("")}</div>
        <p class="monthly-common">常见情绪 · ${common(result.moodCounts, moods)}${commonScenes ? `<br>常见场景 · ${commonScenes}` : ""}</p>`;
    }
    return `<h3>情绪时间线</h3><div class="timeline">${result.days.map((day) => `
      <button type="button" class="timeline-day" data-action="jump-day" data-id="${day.key}" aria-label="${daySummary(day)}"${day.records.length ? "" : " disabled"}>
        <strong>${stamp(day.date, { month: "numeric", day: "numeric" })}</strong>
        <span class="dots">${day.records.map((record) => moodDot(record.mood)).join("")}</span>
      </button>`).join("")}</div>
      <div class="report-legend">${result.moodCounts.map(([id]) => `<span>${moodDot(id)}${moods[id].label}</span>`).join("")}</div>`;
  }

  function renderReview() {
    const range = state.ranges[state.space];
    report = makeReport(currentData(), range);
    const { records, days, coverage, observation } = report;
    const dateText = dateRange(days[0].date, days[days.length - 1].date, "long");
    let content = "";
    if (records.length) {
      content = `<div class="report-grid">
          <section class="report-block paper">${renderChart(report)}</section>
          <section class="report-block report-observation paper">
            <h3>${sparkle} 团团的观察</h3>
            <p class="observation-text">${safeText(observation.text)}</p>
            <button type="button" class="quiet-button" data-action="evidence">查看这 ${observation.evidence.length} 条</button>
          </section>
        </div>
        <section class="review-records" aria-labelledby="review-records-heading">
          <div class="section-heading">
            <h2 id="review-records-heading">这段时间的片段</h2>
            <span class="subtle-count">${countLabel(records.length)}</span>
          </div>
          ${[...days].reverse().filter((day) => day.records.length).map((day) => `
            <section id="day-${day.key}" class="day-group" tabindex="-1" aria-label="${stamp(day.date, dateOptions)}的记录">
              <h3>${stamp(day.date, { ...dateOptions, weekday: "long" })}</h3>
              <div class="record-list">${day.records.map((record) => openRecordCard(record)).join("")}</div>
            </section>`).join("")}
        </section>`;
    } else {
      content = `<section class="review-empty paper">
        <span class="empty-icon">${icons("mail")}</span>
        <h3>这段时间还没有记录</h3>
        <p>从一个情绪开始，团团会给你回信。</p>
        <button type="button" class="primary-button" data-action="compose-panel" aria-haspopup="dialog">记下此刻</button>
      </section>`;
    }

    reviewPage.innerHTML = `<div class="review-top">
      <h1>回顾</h1>
      <div class="period-controls" role="group" aria-label="回顾日期范围">
        ${Object.keys(periods).map((value) => `<button type="button" data-action="range" data-id="${value}" aria-pressed="${range === Number(value)}">近 ${value} 天</button>`).join("")}
      </div>
    </div>
    <section class="report-cover" aria-label="情绪小报">
      <div>
        <p class="report-dates">${dateText}</p>
        <h2>${periods[range]}</h2>
        <p class="report-stats"><span><strong>${records.length}</strong> 条记录</span><span>覆盖 <strong>${coverage}</strong> 天</span></p>
      </div>
      <img src="${LaughingPandaArt}" alt="" width="364" height="480" decoding="async">
      ${records.length ? `<button type="button" class="primary-button" data-action="share">${icons("picture")} 保存小报</button>` : ""}
    </section>
    ${content}`;
  }

  function renderBanner() {
    const inExample = state.space === "example";
    spaceButton.dataset.action = inExample ? "exit-example" : "example";
    spaceButton.innerHTML = inExample ? "<span>退出示例</span>" : `${sparkle}<span>示例体验</span>`;
    spaceButton.disabled = state.saving || state.switching;
    sampleBanner.hidden = !inExample;
    if (!inExample) return;
    const isReview = currentPage() === "review";
    const isUnlocked = Boolean(currentData().unlocks.seat);
    const title = "<strong>示例空间</strong>";
    const text = isUnlocked
      ? "这里的记录和成就独立保存。"
      : "试记「疲惫」＋「通勤」，看看新成就。";
    sampleBanner.innerHTML = `<span>${title}${text}</span>${
      isReview ? '<button class="quiet-button" type="button" data-action="today">试记一条</button>'
        : '<button class="quiet-button" type="button" data-action="review">回到小报</button>'
    }`;
  }

  function render() {
    const today = currentPage() === "today";
    todayPage.hidden = !today;
    reviewPage.hidden = today;
    for (const button of navButtons) {
      if (button.dataset.action === currentPage()) button.setAttribute("aria-current", "page");
      else button.removeAttribute("aria-current");
    }
    renderToday();
    if (today) renderWeeklyPreview();
    else renderReview();
    renderBanner();
    syncComposer();
  }

  function changePage(page) {
    if (page === currentPage()) return;
    state.pages[state.space] = page;
    render();
    window.scrollTo(0, 0);
  }

  async function switchSpace(space) {
    if (space === state.space || state.saving || state.switching) return;
    state.switching = true;
    spaceButton.disabled = true;
    syncComposer();
    try {
      state.data[space] = await load(space);
      state.space = space;
      highlightUntil = 0;
      animation.hidden = true;
      toast.hidden = true;
      composerError.hidden = true;
      window.scrollTo(0, 0);
    } catch {
      showToast("暂时读不到本地记录，请再试一次。");
    } finally {
      state.switching = false;
      render();
    }
  }

  async function prepareSaveAudio() {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return null;

    try {
      const context = saveAudioContext ??= new AudioContext();
      // Resume during the submit gesture so mobile browsers can play after storage commits.
      if (context.state !== "running") await context.resume();
      return context;
    } catch {
      return null;
    }
  }

  async function playSaveSound(audioReady, mood) {
    try {
      const context = await audioReady;
      if (!context) return;

      const clip = SaveSoundClips[saveSoundByMood[mood] || "piano"];
      const bytes = Uint8Array.from(atob(clip), (character) => character.charCodeAt(0));
      const source = context.createBufferSource();
      source.buffer = await context.decodeAudioData(bytes.buffer);
      source.connect(context.destination);
      source.start();
    } catch {
      // The record is still saved if the browser cannot play its sound.
    }
  }

  async function saveRecord(event) {
    event.preventDefault();
    if (saveButton.disabled) return;
    const audioReady = prepareSaveAudio();

    const space = state.space;
    const composeFrame = activeFrame()?.kind === "compose" ? activeFrame() : null;
    const fields = { ...state.drafts[space] };
    const signature = JSON.stringify(fields);
    if (state.attempts[space]?.signature !== signature) {
      state.attempts[space] = { signature, id: makeId(), at: Date.now() };
    }
    const { id, at } = state.attempts[space];
    state.saving = true;
    spaceButton.disabled = true;
    composerError.hidden = true;
    syncComposer();

    let unlocked = "";
    let record;
    try {
      const { data, result } = await operate(space, (pending) => addRecord(pending, fields, id, at));
      state.data[space] = data;
      if (JSON.stringify(state.drafts[space]) === signature) state.drafts[space] = emptyDraft();
      delete state.attempts[space];
      unlocked = result?.unlocked;
      record = data.records.find((entry) => entry.id === id);
      if (!composeFrame || activeFrame() !== composeFrame) showToast(`团团回信 · ${reply(record)}`);
    } catch {
      composerError.textContent = "这次没保存成功，内容已保留。请再试一次。";
      composerError.hidden = false;
    } finally {
      state.saving = false;
      render();
    }
    if (record && composeFrame && activeFrame() === composeFrame) {
      openPanel({ kind: "detail", id: record.id, title: "已收下这一刻" }, { savedMood: record.mood });
    }
    if (record) void playSaveSound(audioReady, record.mood);
    if (unlocked) animateUnlock(unlocked);
  }

  function renderAchievements() {
    const unlocks = currentData().unlocks;
    const count = Object.keys(unlocks).length;
    panelTitle.textContent = `团团的成就册 · ${count}/4`;
    return `<div class="achievement-grid">${Object.entries(achievements).map(([id, item]) => {
      const acquired = Object.hasOwn(unlocks, id);
      return `<article class="achievement-card${acquired ? "" : " is-locked"}">
        ${prop(id)}
        <h3>${item.title}</h3>
        <p class="achievement-combo">${moods[item.mood].label} ＋ ${scenes[item.scene]}</p>
        <p class="achievement-time">${acquired ? `${stamp(unlocks[id], dateOptions)} 解锁` : "待解锁"}</p>
      </article>`;
    }).join("")}</div>`;
  }

  function replyBubble(label, message) {
    return `<div class="detail-reply"><img src="${CupPandaArt}" alt=""><div><strong>${safeText(label)}</strong><p>${safeText(message)}</p></div></div>`;
  }

  function renderDetail(record, title = "记录详情") {
    panelTitle.textContent = title;
    return `<div class="detail-tags">
      ${face(record.mood)}<strong>${moods[record.mood].label}</strong>
      ${record.scene ? `<span>${scenes[record.scene]}</span>` : ""}
      <time datetime="${new Date(record.createdAt).toISOString()}">${stamp(record.createdAt, dateOptions)} ${moment(record.createdAt)}</time>
    </div>
    ${record.note ? `<p class="detail-note">${safeText(record.note)}</p>` : ""}
    ${replyBubble("团团回信", reply(record))}
    <div class="panel-actions">
      <button type="button" class="quiet-button danger-button" data-action="delete">删除记录</button>
      <button type="button" class="quiet-button" data-action="edit">编辑</button>
    </div>`;
  }

  function renderEdit(record) {
    panelTitle.textContent = "编辑记录";
    const labels = Object.fromEntries(Object.entries(moods).map(([id, mood]) => [id, mood.label]));
    return `<form id="edit-form" class="edit-form">
      <div><label for="edit-mood" class="field-label">情绪</label><select class="panel-select" name="mood" id="edit-mood">${selectOptions(labels, record.mood)}</select></div>
      <div><label for="edit-scene" class="field-label">发生在 <span>选填</span></label><select class="panel-select" name="scene" id="edit-scene">${selectOptions(scenes, record.scene, "未选择场景")}</select></div>
      <div><label for="edit-note" class="field-label">留下一句话 <span>选填</span></label><textarea name="note" id="edit-note" maxlength="4000" placeholder="刚刚发生了什么？">${safeText(record.note)}</textarea></div>
      <p class="form-error" role="alert" hidden></p>
      <div class="panel-actions"><button type="button" class="quiet-button" data-action="panel-back">取消</button><button type="submit" class="primary-button">保存修改</button></div>
    </form>`;
  }

  function renderDelete() {
    panelTitle.textContent = "删除这条记录？";
    return `<p class="panel-intro">这条记录会从列表和小报里移除，已经解锁的成就仍会保留。</p>
      <p class="form-error" role="alert" hidden></p>
      <div class="panel-actions">
        <button type="button" class="quiet-button" data-action="panel-back">保留记录</button>
        <button type="button" class="primary-button danger-primary" data-action="confirm-delete">确认删除</button>
      </div>`;
  }

  function shareOption(record) {
    const characters = Array.from(record.note.replace(/\s+/g, " "));
    const excerpt = characters.slice(0, 22).join("") + (characters.length > 22 ? "…" : "");
    return `<option value="${safeText(record.id)}">${stamp(record.createdAt, dateOptions)} · ${safeText(excerpt)}</option>`;
  }

  function renderShare(frame) {
    panelTitle.textContent = "小报分享预览";
    const withNotes = frame.report.records.filter((record) => record.note);
    const dateText = dateRange(frame.report.days[0].date, frame.report.days[frame.report.days.length - 1].date, "long");
    return `${withNotes.length ? `<div class="share-controls">
        <label for="quote-selection">选入一条原文</label>
        <select class="panel-select" id="quote-selection" aria-describedby="quote-tip"><option value="">隐藏原文</option>${withNotes.map(shareOption).join("")}</select>
        <p id="quote-tip">默认隐藏私人原文，你可以挑一条加入小报。</p>
      </div>` : ""}
      <p id="share-message" class="share-loading" role="status">正在生成小报…</p>
      <img class="share-image" id="share-image" alt="${periods[frame.report.range]}，${dateText}，${countLabel(frame.report.records.length)}记录" hidden>
      <div class="panel-actions share-buttons">
        <button type="button" class="quiet-button" data-action="share-image" disabled>打开原图</button>
        <a id="download-image" class="primary-button" download="情绪小报-${dayKey(frame.report.days[frame.report.days.length - 1].date)}${frame.example ? "-示例" : ""}.png" aria-disabled="true" tabindex="-1">${icons("picture")} 保存图片</a>
        <button type="button" class="quiet-button" data-action="retry-image" hidden>重新生成</button>
      </div>
      <p class="share-tip">在微信里可打开原图后长按图片保存。</p>`;
  }

  function setSharePreview(frame, url) {
    const image = byId("share-image");
    const message = byId("share-message");
    const download = byId("download-image");
    const openImage = panelContent.querySelector('[data-action="share-image"]');
    const retry = panelContent.querySelector('[data-action="retry-image"]');
    if (url) {
      image.src = url;
      image.hidden = false;
      message.hidden = true;
      download.href = url;
      download.removeAttribute("aria-disabled");
      download.removeAttribute("tabindex");
      openImage.disabled = false;
      retry.hidden = true;
    } else {
      image.hidden = true;
      image.removeAttribute("src");
      message.hidden = false;
      message.textContent = frame.failed ? "小报暂时没有生成，请重试。" : "正在生成小报…";
      download.removeAttribute("href");
      download.setAttribute("aria-disabled", "true");
      download.tabIndex = -1;
      openImage.disabled = true;
      retry.hidden = !frame.failed;
    }
  }

  async function updateImage(frame) {
    const revision = (frame.imageRevision ?? 0) + 1;
    frame.imageRevision = revision;
    frame.failed = false;
    frame.url = "";
    setSharePreview(frame, "");
    const quote = frame.report.records.find((entry) => entry.id === frame.quoteId);
    const landscape = landscapeForMood(frame.report.moodCounts[0]?.[0]);
    try {
      const url = await ShareCard.create(frame.report, quote, frame.example, landscape?.src);
      if (revision !== frame.imageRevision) return;
      frame.url = url;
    } catch {
      if (revision !== frame.imageRevision) return;
      frame.failed = true;
    }
    if (activeFrame() === frame) setSharePreview(frame, frame.url);
  }

  function landscapeForMood(mood) {
    return saveLandscapes.find((image) => image.dataset.moods.split(" ").includes(mood));
  }

  function showSaveLandscape(mood) {
    const selected = landscapeForMood(mood);
    for (const image of saveLandscapes) image.hidden = image !== selected;
    panel.classList.toggle("has-save-landscape", Boolean(selected));
  }

  function stopSaveVideo() {
    window.clearTimeout(saveVideoTimer);
    saveVideoTimer = undefined;
    if (!saveVideo.hasAttribute("src")) return;
    saveVideo.hidden = true;
    saveVideo.pause();
    saveVideo.removeAttribute("src");
    saveVideo.load();
  }

  async function showSaveVideo(mood) {
    stopSaveVideo();
    if (!mood) return;

    const clip = upbeatVideoMoods.has(mood) ? SaveVideoClips.upbeat : SaveVideoClips.subdued;
    saveVideo.muted = true;
    saveVideo.src = `data:video/mp4;base64,${clip}`;
    saveVideo.hidden = false;
    const timeout = window.setTimeout(stopSaveVideo, 4000);
    saveVideoTimer = timeout;

    try {
      await saveVideo.play();
      if (saveVideoTimer !== timeout) return;
      window.clearTimeout(timeout);
      saveVideoTimer = window.setTimeout(stopSaveVideo, 4000);
    } catch {
      if (saveVideoTimer === timeout) stopSaveVideo();
    }
  }

  function renderPanel({ savedMood } = {}) {
    const frame = activeFrame();
    if (!frame) return;
    showSaveLandscape(savedMood);
    void showSaveVideo(savedMood);
    panelBack.hidden = panelStack.length < 2;
    const composing = frame.kind === "compose";
    composeView.hidden = !composing;
    panelContent.hidden = composing;
    panelScroll.scrollTop = 0;
    if (composing) {
      panelTitle.textContent = "两步记下来";
      panelContent.replaceChildren();
      return;
    }
    const record = frame.id ? currentRecord(frame.id) : null;
    if (frame.id && !record) {
      panelTitle.textContent = "记录已移除";
      panelContent.innerHTML = '<p class="panel-intro">这条记录已经不在当前空间。</p>';
      return;
    }
    switch (frame.kind) {
      case "achievements":
        panelContent.innerHTML = renderAchievements();
        break;
      case "detail":
        panelContent.innerHTML = renderDetail(record, frame.title);
        break;
      case "edit":
        panelContent.innerHTML = renderEdit(record);
        break;
      case "delete":
        panelContent.innerHTML = renderDelete();
        break;
      case "evidence":
        panelTitle.textContent = `观察依据 · ${countLabel(frame.records.length)}`;
        panelContent.innerHTML = `<p class="panel-intro">${safeText(frame.observation)}</p>
          <div class="evidence-list">${frame.records.map((entry) => openRecordCard(entry, true)).join("")}</div>`;
        break;
      case "share":
        panelContent.innerHTML = renderShare(frame);
        if (byId("quote-selection")) byId("quote-selection").value = frame.quoteId;
        if (frame.url) setSharePreview(frame, frame.url);
        else void updateImage(frame);
        break;
      case "full-image":
        panelTitle.textContent = "小报原图";
        panelContent.innerHTML = `<img src="${frame.url}" class="image-panel-img" alt="情绪小报原图"><p class="share-tip">长按图片可以保存。</p>`;
        break;
    }
  }

  function openPanel(frame, options) {
    const wasOpen = panel.open;
    if (!wasOpen) returnFocus = document.activeElement;
    panelStack.push(frame);
    renderPanel(options);
    if (!wasOpen) {
      panel.showModal();
      document.body.classList.add("has-panel");
    }
    panelTitle.focus({ preventScroll: true });
  }

  function finishPanel() {
    panelStack.length = 0;
    panel.close();
    showSaveLandscape();
    stopSaveVideo();
    document.body.classList.remove("has-panel");
    composeView.hidden = true;
    panelContent.replaceChildren();
    if (returnFocus?.isConnected) returnFocus.focus({ preventScroll: true });
    else navButtons[currentPage() === "today" ? 0 : 1].focus({ preventScroll: true });
    returnFocus = null;
  }

  function backPanel() {
    if (panelStack.length < 2) {
      finishPanel();
      return;
    }
    panelStack.pop();
    renderPanel();
    panelTitle.focus({ preventScroll: true });
  }

  async function modifyRecord(frame, change, deleting = false) {
    if (frame.busy) return;
    frame.busy = true;
    const space = state.space;
    const button = panelContent.querySelector('button[type="submit"], [data-action="confirm-delete"]');
    button.disabled = true;
    try {
      const { data, result } = await operate(space, change);
      state.data[space] = data;
      render();
      if (activeFrame() !== frame) return;
      if (!result || deleting) {
        finishPanel();
        showToast(result ? "已删除这条记录。" : "这条记录已移除。");
        return;
      }
      backPanel();
    } catch {
      if (activeFrame() !== frame) return;
      const error = panelContent.querySelector(".form-error");
      error.textContent = "这次操作没能保存，请再试一次。";
      error.hidden = false;
    } finally {
      frame.busy = false;
      if (button.isConnected) button.disabled = false;
    }
  }

  function jumpToDay(key) {
    const section = byId(`day-${key}`);
    if (!section) return;
    section.focus({ preventScroll: true });
    section.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    section.classList.add("is-targeted");
    setTimeout(() => section.classList.remove("is-targeted"), 1650);
  }

  document.addEventListener("click", (event) => {
    const target = event.target.closest("[data-action]");
    if (!target || target.disabled) return;
    const { action, id } = target.dataset;
    switch (action) {
      case "today":
      case "review":
        changePage(action);
        break;
      case "weekly-review":
        state.ranges[state.space] = 7;
        changePage("review");
        break;
      case "example":
      case "exit-example":
        void switchSpace(action === "example" ? "example" : "personal");
        break;
      case "scene": {
        const draft = state.drafts[state.space];
        draft.scene = draft.scene === id ? "" : id;
        syncComposer();
        break;
      }
      case "range":
        if (state.ranges[state.space] !== Number(id)) {
          state.ranges[state.space] = Number(id);
          renderReview();
          reviewPage.querySelector(`[data-action="range"][data-id="${id}"]`).focus({ preventScroll: true });
        }
        break;
      case "jump-day":
        jumpToDay(id);
        break;
      case "compose-panel":
        if (id && moods[id]) {
          state.drafts[state.space].mood = id;
          syncComposer();
        }
        openPanel({ kind: "compose" });
        break;
      case "achievements":
        highlightUntil = 0;
        renderBadge();
        openPanel({ kind: "achievements" });
        break;
      case "detail":
        openPanel({ kind: "detail", id });
        break;
      case "edit":
      case "delete":
        openPanel({ kind: action, id: activeFrame().id });
        break;
      case "confirm-delete": {
        const frame = activeFrame();
        void modifyRecord(frame, (data) => deleteRecord(data, frame.id), true);
        break;
      }
      case "evidence":
        openPanel({ kind: "evidence", records: report.observation.evidence, observation: report.observation.text });
        break;
      case "share":
        openPanel({ kind: "share", report, quoteId: "", example: state.space === "example" });
        break;
      case "retry-image":
        void updateImage(activeFrame());
        break;
      case "share-image":
        openPanel({ kind: "full-image", url: activeFrame().url });
        break;
      case "panel-back":
        backPanel();
        break;
      case "close-panel":
        finishPanel();
        break;
    }
  });

  form.addEventListener("change", (event) => {
    if (event.target.name === "mood") {
      state.drafts[state.space].mood = event.target.value;
      syncComposer();
    }
  });
  note.addEventListener("input", () => { state.drafts[state.space].note = note.value; });
  form.addEventListener("submit", saveRecord);
  saveVideo.addEventListener("ended", () => {
    if (saveVideo.ended) stopSaveVideo();
  });
  panel.addEventListener("change", (event) => {
    if (event.target.id === "quote-selection") {
      const frame = activeFrame();
      frame.quoteId = event.target.value;
      void updateImage(frame);
    }
  });
  panel.addEventListener("submit", (event) => {
    if (event.target.id !== "edit-form") return;
    event.preventDefault();
    const fields = Object.fromEntries(new FormData(event.target));
    const frame = activeFrame();
    void modifyRecord(frame, (data) => editRecord(data, frame.id, fields, Date.now()));
  });
  panel.addEventListener("cancel", (event) => {
    event.preventDefault();
    if (panelStack.length > 1) backPanel();
    else finishPanel();
  });
  panel.addEventListener("click", (event) => {
    if (event.target !== panel) return;
    const bounds = panel.getBoundingClientRect();
    if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) {
      finishPanel();
    }
  });

  function refreshDate() {
    const key = dayKey(new Date());
    if (key === lastDay) return;
    lastDay = key;
    render();
  }

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) refreshDate();
  });

  function setupCarouselPlayback(strip, playback, advance, label = "") {
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    let playing = !reducedMotion.matches;
    let touching = false;
    let rotationTimer;

    function restart() {
      clearTimeout(rotationTimer);
      if (!playing || touching || document.hidden) return;
      rotationTimer = setTimeout(() => {
        if (!panel.open && strip.clientWidth) advance();
        restart();
      }, 3000);
    }

    function refresh() {
      playback.dataset.playing = playing;
      playback.setAttribute("aria-label", (playing ? "暂停" : "开启") + "自动翻阅" + label);
      restart();
    }

    function endGesture() {
      if (!touching) return;
      touching = false;
      restart();
    }

    playback.addEventListener("click", () => {
      playing = !playing;
      refresh();
    });
    strip.parentElement.addEventListener("pointerdown", () => {
      touching = true;
      restart();
    });
    window.addEventListener("pointerup", endGesture);
    window.addEventListener("pointercancel", endGesture);
    document.addEventListener("visibilitychange", () => {
      touching = false;
      restart();
    });
    refresh();
    return restart;
  }

  function setupIllustrations() {
    const strip = byId("illustration-slides");
    const dots = [...byId("illustration-dots").querySelectorAll("button")];
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const current = () => Math.round(strip.scrollLeft / strip.clientWidth);
    function moveTo(index, jump = false) {
      strip.scrollTo({
        left: index * strip.clientWidth,
        behavior: jump || reducedMotion.matches ? "auto" : "smooth",
      });
    }
    const restart = setupCarouselPlayback(strip, byId("illustration-playback"), () => {
      const next = (current() + 1) % dots.length;
      moveTo(next, next === 0);
    });
    dots.forEach((dot, index) => {
      dot.addEventListener("click", () => {
        moveTo(index);
        restart();
      });
    });
    strip.addEventListener("scroll", () => {
      if (!strip.clientWidth) return;
      const selected = current();
      dots.forEach((dot, index) => {
        const isSelected = index === selected;
        dot.setAttribute("aria-current", isSelected);
        strip.children[index].setAttribute("aria-hidden", !isSelected);
      });
      restart();
    }, { passive: true });
    strip.addEventListener("keydown", (event) => {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      const next = current() + (event.key === "ArrowRight" ? 1 : -1);
      moveTo(Math.max(0, Math.min(next, dots.length - 1)));
      restart();
    });
  }

  function setupReplyCards() {
    const deck = byId("reply-deck");
    const strip = byId("reply-slides");
    const cards = [...strip.children];
    const layers = [deck.querySelector(".reply-stack-next"), deck.querySelector(".reply-stack-back")];
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    let current = 0;
    let turning = false;
    let gesture;
    const restart = setupCarouselPlayback(strip, byId("reply-playback"), () => turn(1), "回信");

    function select(index) {
      current = index;
      cards.forEach((card, position) => {
        card.classList.toggle("is-current", position === index);
        card.setAttribute("aria-hidden", position !== index);
      });
      layers.forEach((layer, offset) => {
        layer.dataset.tone = cards[(index + offset + 1) % cards.length].dataset.tone;
      });
    }

    function turn(step) {
      if (turning) return;
      const next = (current + step + cards.length) % cards.length;
      restart();
      if (reducedMotion.matches) {
        select(next);
        return;
      }

      turning = true;
      const outgoing = cards[current];
      const incoming = cards[next];
      function finish() {
        clearTimeout(fallback);
        outgoing.removeEventListener("animationend", finish);
        select(next);
        outgoing.classList.remove("is-turning");
        incoming.classList.remove("is-underneath");
        strip.classList.remove("is-flipping");
        turning = false;
      }
      const fallback = setTimeout(finish, 700);
      outgoing.addEventListener("animationend", finish, { once: true });
      incoming.classList.add("is-underneath");
      outgoing.classList.add("is-turning");
      strip.classList.add("is-flipping");
    }

    for (const button of deck.querySelectorAll("[data-step]")) {
      button.addEventListener("click", () => turn(Number(button.dataset.step)));
    }
    strip.addEventListener("keydown", (event) => {
      if (event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
      event.preventDefault();
      turn(event.key === "ArrowDown" ? 1 : -1);
    });
    strip.addEventListener("pointerdown", (event) => {
      if (!event.isPrimary || event.button !== 0) return;
      gesture = { id: event.pointerId, x: event.clientX, y: event.clientY };
      strip.setPointerCapture(event.pointerId);
    });
    strip.addEventListener("pointercancel", () => { gesture = null; });
    strip.addEventListener("pointerup", (event) => {
      if (gesture?.id !== event.pointerId) return;
      const dx = event.clientX - gesture.x;
      const dy = event.clientY - gesture.y;
      gesture = null;
      if (dx < -12 && dy < -8) turn(1);
      else if (dx > 12 && dy > 8) turn(-1);
    });
    select(0);
  }

  async function start() {
    setupIllustrations();
    setupReplyCards();
    byId("record-orbit").insertAdjacentHTML("beforeend", Object.entries(moods).map(([id, mood]) => `
      <button type="button" class="mood-bubble" data-action="compose-panel" data-id="${id}" aria-haspopup="dialog"
        style="--bubble-fill:${mood.tint};--bubble-border:${mood.color}">
        ${face(id)}<span>${mood.label}</span>
      </button>`).join(""));
    byId("mood-choices").innerHTML = Object.entries(moods).map(([id, mood]) => `
      <label class="mood-option"><input type="radio" name="mood" value="${id}">
        <span class="choice-inner">${face(id)}<span>${mood.label}</span></span>
      </label>`).join("");
    sceneChoices.innerHTML = Object.entries(scenes).map(([id, label]) =>
      `<button type="button" class="scene-choice" data-action="scene" data-id="${id}" aria-pressed="false">${label}</button>`
    ).join("");
    panelTitle.tabIndex = -1;
    render();
    try {
      state.data.personal = await load("personal");
    } catch {
      showToast("暂时读不到本地记录，请检查浏览器是否允许本地存储。");
    } finally {
      ready = true;
      render();
    }
    setInterval(refreshDate, 30_000);
  }

  void start();
})();

</script>
</body>
</html>
